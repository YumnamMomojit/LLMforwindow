[package]
name = "semdok-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Semdok Edge core: restricted inference gateway, API keys, storage, engine supervision"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-graceful", "service", "tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "io-util", "fs"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
fs4 = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading",
  "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
